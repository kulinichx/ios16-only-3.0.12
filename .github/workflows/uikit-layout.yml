name: UIKit_layout_check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uikit-layout:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Test simulator runner error handling (mocked)
        run: node --test tests/preferences-ui-simulator.test.cjs
      - name: Verify UIKit table geometry and layering
        env:
          DORH_RUN_UIKIT_SIMULATOR: '1'
          DORH_SIMULATOR_RUNTIME: '18.5'
        run: node --test --test-name-pattern='UIKit simulator exercises' tests/glass-ui-contracts.test.cjs
      - name: Upload UIKit layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIKit_layout_evidence
          path: .audit-artifacts/preferences-ui/
          if-no-files-found: ignore
