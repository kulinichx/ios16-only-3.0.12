name: build_RootHide_iOS16

on:
  push:
    branches:
      - ios16-roothide-3.0.12
      - rc9-ios16-next
    paths:
      - .github/workflows/build.yml
      - Application/**
      - BaseBin/**
      - tests/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_SDK_VERSION: '16.5'
  XCODE_VERSION: '26.6'
  HOMEBREW_NO_AUTO_UPDATE: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: node scripts/prepare-xpf-ios16.cjs
      - run: node --test tests/ios16-contracts.test.cjs tests/glass-ui-contracts.test.cjs tests/lowpower-schedule-contracts.test.cjs tests/supporter-license-contracts.test.cjs tests/supporter-binding.test.cjs tests/supporter-issuer-integration.test.cjs

  build:
    if: github.event_name == 'workflow_dispatch'
    # Keep the tested macOS/Xcode generation without the ARM64 capacity queue.
    runs-on: macos-26-intel
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify runner and toolchain
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = 'X64'
          actual_xcode="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          test "$actual_xcode" = "$XCODE_VERSION"
          {
            echo "Runner architecture: $RUNNER_ARCH"
            sw_vers
            uname -m
            xcodebuild -version
            xcode-select -p
            xcrun --sdk iphoneos --show-sdk-version
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check iOS 16 source contracts
        run: |
          node scripts/prepare-xpf-ios16.cjs
          node --test tests/ios16-contracts.test.cjs tests/glass-ui-contracts.test.cjs tests/lowpower-schedule-contracts.test.cjs tests/supporter-license-contracts.test.cjs tests/supporter-binding.test.cjs tests/supporter-issuer-integration.test.cjs
          plutil -lint Application/Dopamine.xcodeproj/project.pbxproj
          plutil -lint Application/Dopamine/UI/PkgManagers/PkgManagers.plist
          plutil -lint Application/Dopamine/UI/Themes/Themes.plist
          plutil -lint Application/Dopamine/UI/Settings/Credits.plist
          plutil -lint Application/Dopamine/en.lproj/Localizable.strings
          plutil -lint Application/Dopamine/zh-Hans.lproj/Localizable.strings
          plutil -lint Application/Dopamine/zh-CN.lproj/Localizable.strings
          for plist in Application/Dopamine/Exploits/*/Info.plist; do
            plutil -lint "$plist"
          done

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make xz-utils

      - name: Install better GNU Make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Restore RootHide Theos and SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-roothide-${{ runner.os }}-${{ runner.arch }}-sdk${{ env.THEOS_SDK_VERSION }}-v1

      - name: Install THEOS
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          sdk_archive="$RUNNER_TEMP/iPhoneOS${THEOS_SDK_VERSION}.sdk.tar.xz"
          curl -fL --retry 3 "https://github.com/theos/sdks/releases/latest/download/iPhoneOS${THEOS_SDK_VERSION}.sdk.tar.xz" --output "$sdk_archive"
          tar -xJf "$sdk_archive" -C "$THEOS/sdks"

      - name: Verify source and tools
        run: |
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${THEOS_SDK_VERSION}.sdk"
          grep -Fq '@implementation DOBootstrapper(roothide)' Application/Dopamine/Jailbreak/DOBootstrapper.m
          grep -Fq '@implementation DOEnvironmentManager(roothide)' Application/Dopamine/Jailbreak/DOBootstrapper.m
          grep -Fq 'cn.zqbb.dopaRH' Application/Dopamine.xcodeproj/project.pbxproj
          git submodule status --recursive
          test -z "$(git submodule status --recursive | grep -E '^[+-U]' || true)"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$(cat BaseBin/_external/basebin/.version)"
            echo "roothide_version=$(cat BaseBin/_external/basebin/.version-roothide)"
            echo "theos_commit=$(git -C "$THEOS" rev-parse HEAD)"
            echo "sdk=$THEOS_SDK_VERSION"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "xcode_requested=$XCODE_VERSION"
            echo "xcode_selected=$(xcodebuild -version | tr '\n' ';')"
            echo "developer_dir=$(xcode-select -p)"
            echo "xcode_iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            git submodule status --recursive
          } > build-provenance.txt
          node scripts/prepare-xpf-ios16.cjs --verify >> build-provenance.txt

      - name: Build and Install trustcache
        run: |
          set -x
          brew list --versions openssl@3 >/dev/null 2>&1 || brew install openssl@3
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl@3)/include -arch $(uname -m)"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl@3)/lib -arch $(uname -m)"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo install -m 755 trustcache /opt/procursus/bin/trustcache

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M%S')
          TS=$(date +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TS}" >> "$GITHUB_ENV"

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Build
        run: |
          set -x
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
          VERSION="$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)"
          PACKAGE_NAME="Dopamine-rh-rc9-$(git rev-parse --short HEAD).tipa"
          mv ./Application/Dopamine.tipa "./Application/${PACKAGE_NAME}"
          echo "version=${VERSION}" >> $GITHUB_ENV
          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "package_name=${PACKAGE_NAME}" >> build-provenance.txt

      - name: Verify TIPA
        run: |
          set -euo pipefail
          tipa="Application/${{ env.package_name }}"
          unzip -tq "$tipa"
          unzip -Z1 "$tipa" > package-files.txt
          grep -Fx 'Payload/Dopamine.app/Dopamine.roothide' package-files.txt
          grep -Fx 'Payload/Dopamine.app/libroothider.dylib' package-files.txt
          for required in bootstrap_1900.tar.zst basebin.tar sileo.deb roothideapp.deb roothideWhite.deb libroot.deb libkrw-dopamine.deb basebin-link.deb; do
            grep -Fx "Payload/Dopamine.app/$required" package-files.txt
          done
          if grep -Ei 'zebra|bootstrap_1800|launchctl_.*\.deb|palera1n\.framework|badRecovery\.framework|weightBufs\.framework|multicast_bytecopy\.framework' package-files.txt; then
            echo "::error::Excluded resources were found in the iOS 16 package."
            exit 1
          fi
          expected_frameworks='ClearSword DarkSword Titan dmaFail kfd momentarius'
          expected_frameworks="$(printf '%s\n' $expected_frameworks | sort -u | paste -sd ' ' -)"
          actual_frameworks="$(sed -nE 's@^Payload/Dopamine.app/Frameworks/([^/]+)\.framework/.*@\1@p' package-files.txt | sort -u | paste -sd ' ' -)"
          test "$actual_frameworks" = "$expected_frameworks"
          unzip -p "$tipa" Payload/Dopamine.app/basebin.tar > "$RUNNER_TEMP/ios16-basebin.tar"
          tar -tf "$RUNNER_TEMP/ios16-basebin.tar" > basebin-files.txt
          for architecture in arm64 arm64e; do
            grep -Fx "basebin/dyldhook_merge.$architecture.iOS16-17.dylib" basebin-files.txt
          done
          test "$(grep -Ec '^basebin/dyldhook.*\.dylib$' basebin-files.txt)" -eq 2
          if grep -Ei '(^|/)(hookd|[^/]*iOS15[^/]*|[^/]*iOS18[^/]*)(/|$)' basebin-files.txt; then
            echo "::error::Non-iOS-16 payload found inside basebin.tar."
            exit 1
          fi
          tar -xOf "$RUNNER_TEMP/ios16-basebin.tar" basebin/libxpf.dylib > "$RUNNER_TEMP/ios16-libxpf.dylib"
          nm -gj "$RUNNER_TEMP/ios16-libxpf.dylib" > xpf-exports.txt
          if grep -E '_xpf_(bad_recovery_init|sptm_txm_init|supported_15|supported_sptm|supported_26)' xpf-exports.txt; then
            echo "::error::Non-iOS-16 XPF exports found in packaged libxpf."
            exit 1
          fi
          unzip -p "$tipa" Payload/Dopamine.app/Info.plist > "$RUNNER_TEMP/RootHide-Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/RootHide-Info.plist")" = 'cn.zqbb.dopaRH'
          test "$(plutil -extract MinimumOSVersion raw -o - "$RUNNER_TEMP/RootHide-Info.plist")" = '16.0'
          unzip -p "$tipa" Payload/Dopamine.app/Dopamine > "$RUNNER_TEMP/RootHide-Dopamine"
          ldid -e "$RUNNER_TEMP/RootHide-Dopamine" > app-entitlements.plist
          plutil -lint app-entitlements.plist
          plutil -convert json -o "$RUNNER_TEMP/RootHide-entitlements.json" app-entitlements.plist
          plutil -convert json -o "$RUNNER_TEMP/RootHide-Info.json" "$RUNNER_TEMP/RootHide-Info.plist"
          node scripts/verify-app-entitlements.cjs "$RUNNER_TEMP/RootHide-entitlements.json" "$RUNNER_TEMP/RootHide-Info.json"
          unzip -p "$tipa" Payload/Dopamine.app/Credits.plist > "$RUNNER_TEMP/RootHide-Credits.plist"
          plutil -lint "$RUNNER_TEMP/RootHide-Credits.plist"
          plutil -convert xml1 -o "$RUNNER_TEMP/RootHide-Credits.xml" "$RUNNER_TEMP/RootHide-Credits.plist"
          if grep -Ei 'Supporter_Title|supporterLicensePressed|<string>supporter</string>|<string>BUILDER</string>|kulinichx' "$RUNNER_TEMP/RootHide-Credits.xml"; then
            echo "::error::Removed authorization entry or builder attribution found in packaged Credits."
            exit 1
          fi
          unzip -lv "$tipa" > package-contents.txt
          shasum -a 256 "$tipa" >> build-provenance.txt
          wc -c "$tipa" >> build-provenance.txt
          cat build-provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact (TIPA)
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: RootHide_iOS16_TIPA
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Application/${{ env.package_name }}
            build-provenance.txt
            package-contents.txt
            basebin-files.txt
            xpf-exports.txt
            app-entitlements.plist
